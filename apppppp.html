:root[data-theme="dark"]{--bg:#0e1116;--sf:#181c24;--tx:#eef0f4;--mu:#98a1b3;--bd:#2a303c;--pr:#818cf8;--ok:#34d399;--wn:#fbbf24;--er:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 6px}h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.big{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}.mu{color:var(--mu);font-size:13px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--pr);transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px}.k b{font-size:22px;display:block}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
button,.btn{font:inherit;min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.p{background:var(--pr);color:#fff;border-color:transparent}.sm{min-height:38px;padding:0 11px;font-size:14px}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.badge{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--bd)}.hot{color:var(--er)}.warm{color:var(--wn)}
.fb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.fb span{width:96px}.fb div{flex:1;height:18px;background:var(--bd);border-radius:6px;overflow:hidden}.fb i{display:block;height:100%;background:var(--pr)}.fb em{width:78px;font-style:normal;text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;flex-direction:column;font-size:11px;min-width:56px;color:var(--mu);gap:2px;padding:0 4px}nav button.on{color:var(--pr);font-weight:600}nav .add{background:var(--pr);color:#fff;border-radius:50%;width:56px;height:56px;min-width:56px;margin-top:-26px;font-size:28px;box-shadow:0 4px 14px rgba(79,70,229,.4)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}#sh.o{display:flex}#sh>div{background:var(--bg);width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
#ts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:30;display:none}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;text-align:right;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}
html{-webkit-text-size-adjust:100%}input,select,textarea{font-size:16px}</style></head><body><main id="app"></main><div id="sh" role="dialog" aria-modal="true"><div id="shc"></div></div><div id="ts" role="status"></div>
<nav id="nv"></nav>
<script>
const K='wc_crm_v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{set:{target:200,per:50,slots:[[9,10.5],[11,12.5],[14.5,16],[17,18.5]]},leads:[],calls:[]};
let tab='home',q='',fs='',so='score';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage unavailable: not saved')}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=t=>new Date(t).toLocaleDateString('en-CA'),TD=()=>day(Date.now()),inr=n=>'₹'+(+n||0).toLocaleString('en-IN'),uid=()=>Math.random().toString(36).slice(2,10);
const addD=n=>day(Date.now()+n*864e5),ph=p=>String(p).replace(/\D/g,'').slice(-10);
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
const CATS=['Restaurant','Cafe','Hotel','Bakery','Cake Shop','Salon','Gym','Clinic','Dentist','Coaching','Tuition','School','Sports Academy','Martial Arts','Real Estate','Automobile','Garage','Interior Design','Photographer','Event Business','Retail','Manufacturer','Other'];
const RES=['No answer','Busy','Switched off','Wrong number','Answered','Conversation','Interested','Not interested','Call back later','Asked for WhatsApp','Proposal requested','Deal','Lost'];
const STG={'No answer':'Contacted','Busy':'Contacted','Switched off':'Contacted','Wrong number':'Lost','Answered':'Answered','Conversation':'Conversation','Interested':'Interested','Not interested':'Lost','Call back later':'Follow-up','Asked for WhatsApp':'WhatsApp Sent','Proposal requested':'Proposal Sent','Deal':'Won','Lost':'Lost'};
const SCO={New:20,Contacted:25,Answered:35,Conversation:50,Interested:70,'WhatsApp Sent':72,'Follow-up':55,'Proposal Sent':85,Negotiation:88,Won:100,Lost:0};
const STAGES=Object.keys(SCO),PK={Starter:6999,Business:11999,Premium:17999};
const ANS=r=>!['No answer','Busy','Switched off','Wrong number'].includes(r),CONV=r=>['Conversation','Interested','Not interested','Asked for WhatsApp','Proposal requested','Deal'].includes(r),INT=r=>['Interested','Asked for WhatsApp','Proposal requested','Deal'].includes(r);
const coll=l=>(l.pay||[]).reduce((a,p)=>a+p.amt,0),score=l=>l.ov!=null?l.ov:Math.min(100,(SCO[l.stage]||0)+(l.wa?5:0)+(l.price?5:0));
const tier=s=>s>=80?['🔥 Hot','hot']:s>=60?['🟡 Warm','warm']:s>=40?['🟠 Low','']:['❄️ Cold',''];
const callsOn=d=>S.calls.filter(c=>day(c.ts)===d);
const fun=cs=>[['Calls',cs.length],['Answered',cs.filter(c=>ANS(c.r)).length],['Conversation',cs.filter(c=>CONV(c.r)).length],['Interested',cs.filter(c=>INT(c.r)).length],['WhatsApp',cs.filter(c=>c.wa).length],['Proposal',cs.filter(c=>c.r==='Proposal requested'||c.r==='Deal').length],['Deal',cs.filter(c=>c.r==='Deal').length]];
function pace(){const n=new Date(),h=n.getHours()+n.getMinutes()/60;let e=0;for(const[a,b]of S.set.slots){if(h>=b)e+=S.set.per;else if(h>a)e+=S.set.per*(h-a)/(b-a)}return Math.round(e)}
function streak(){let s=0,i=callsOn(TD()).length>=S.set.target?0:1;for(;;i++){if(callsOn(addD(-i)).length>=S.set.target)s++;else break}return s}
const won=()=>S.leads.filter(l=>l.stage==='Won'&&l.price);
const lead=id=>S.leads.find(l=>l.id===id);
function fuList(){const t=TD();return S.leads.filter(l=>l.next&&!['Won','Lost'].includes(l.stage)).sort((a,b)=>a.next<b.next?-1:1)}
function card(l,x=''){const s=score(l),[t,c]=tier(s);return `<div class="card"><div class="row sp" onclick="detail('${l.id}')" style="cursor:pointer"><div><b>${esc(l.name)}</b><div class="mu">${esc(l.cat||'')} ${l.city?'· '+esc(l.city):''} · ${esc(l.phone)}</div></div><div style="text-align:right"><span class="${c}">${t} ${s}</span><div class="mu">${l.stage}</div></div></div>${x}<div class="row" style="margin-top:8px">${acts(l)}</div></div>`}
const acts=l=>`<a class="btn sm p" target="_top" rel="noopener" href="tel:+91${ph(l.phone)}">📞 Call</a><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/91${ph(l.wa_no||l.phone)}">WhatsApp</a><button class="sm" onclick="logSheet('${l.id}')">Log</button>`;
const QK=['No answer','Busy','Wrong number','Answered','Not interested'],QD=['Interested','Call back later','Asked for WhatsApp','Deal'];
const QL={'Busy':'Busy / Off','Wrong number':'Wrong no.','Call back later':'Call back','Asked for WhatsApp':'WhatsApp','Deal':'Deal ✓'};
function qp(cs){const b=(r,c)=>`<button class="${c}" style="flex:1;min-width:30%;min-height:54px;line-height:1.2" onclick="${QD.includes(r)?`qsheet('${r}')`:`qlog('${r}')`}">${QL[r]||r}<br><small>${cs.filter(x=>x.r===r).length} today</small></button>`;
return `<div class="card"><div class="mu" style="margin-bottom:8px">Tap after every call (1 tap = 1 call)</div><div class="row" style="flex-wrap:wrap">${QK.map(r=>b(r,'')).join('')}</div><div class="mu" style="margin:12px 0 6px">Needs number and details</div><div class="row" style="flex-wrap:wrap">${QD.map(r=>b(r,'p')).join('')}</div><button class="sm" style="margin-top:10px" onclick="undo()">↩ Undo last tap</button></div>`}
function qlog(r){S.calls.push({id:uid(),lid:null,ts:Date.now(),r,wa:false,note:''});save();draw();toast(r+' logged')}
function undo(){const c=S.calls[S.calls.length-1];if(!c){toast('Nothing to undo');return}if(c.lid){toast('Last call is saved on a lead. Edit it there.');return}S.calls.pop();save();draw();toast('Removed: '+c.r)}
function qsheet(r){const d=r==='Deal';sheet(`<h1>${QL[r]||r}</h1><label for="f_n">Business name *</label><input id="f_n"><label for="f_p">Phone *</label><input id="f_p" type="tel" inputmode="tel"><label for="f_c">Category</label><select id="f_c">${opt(CATS,'Other')}</select><input id="f_ci" type="hidden" value="Miraj"><input id="f_r" type="hidden" value="${r}"><input id="f_w" type="checkbox" hidden ${r==='Asked for WhatsApp'?'checked':''}>${d?`<label for="f_k">Package</label><select id="f_k" onchange="$('#f_pr').value=PK[this.value]||''">${opt(['Starter','Business','Premium','Custom'],'Business')}</select><label for="f_pr">Deal price ₹</label><input id="f_pr" type="number" inputmode="numeric" value="11999"><label for="f_a">Advance collected ₹</label><input id="f_a" type="number" inputmode="numeric"><input id="f_d" type="hidden">`:`<input id="f_k" type="hidden" value="Not decided"><input id="f_pr" type="hidden"><input id="f_a" type="hidden"><label for="f_d">Remind me on</label><input id="f_d" type="date" value="${addD(1)}">`}<label for="f_t">Notes</label><textarea id="f_t" rows="2"></textarea><div class="row" style="margin-top:12px"><button class="p" style="flex:1" onclick="saveCall()">Save</button><button onclick="cl()">Cancel</button></div>`);setTimeout(()=>$('#f_n').focus(),50)}
function home(){const cs=callsOn(TD()),n=cs.length,T=S.set.target,pc=Math.min(100,n/T*100),pz=pace(),f=fun(cs);
const rev=won().filter(l=>day(l.wonAt)===TD()).reduce((a,l)=>a+l.price,0),adv=S.leads.flatMap(l=>l.pay||[]).filter(p=>day(p.ts)===TD()).reduce((a,p)=>a+p.amt,0),out=won().reduce((a,l)=>a+l.price-coll(l),0);
const due=fuList().filter(l=>l.next<=TD()),hot=S.leads.filter(l=>!['Won','Lost'].includes(l.stage)).sort((a,b)=>score(b)-score(a)||(a.next||'z')<(b.next||'z')?-1:1).slice(0,5);
const mx=Math.max(1,f[0][1]);
return `<h1>Today’s sales command center</h1><div class="card"><div class="mu">Calls made</div><div class="big">${n} / ${T}</div><div class="bar"><i style="width:${pc}%"></i></div><div class="row sp mu"><span>${pc.toFixed(1)}%</span><span>${n>=T?'🎯 Daily call target achieved':(T-n)+' calls remaining'}</span></div><div class="mu" style="margin-top:6px">${n>=pz?'Ahead of pace by '+(n-pz):'You are '+(pz-n)+' calls behind today’s pace'} · 🔥 Streak ${streak()}d</div></div>
${qp(cs)}<div class="grid"><div class="k"><span class="mu">Answered</span><b>${f[1][1]}</b></div><div class="k"><span class="mu">Conversations</span><b>${f[2][1]}</b></div><div class="k"><span class="mu">Interested</span><b>${f[3][1]}</b></div><div class="k"><span class="mu">WhatsApp</span><b>${f[4][1]}</b></div><div class="k" onclick="go('fu')"><span class="mu">Follow-ups due</span><b>${due.length}</b></div><div class="k"><span class="mu">Proposals</span><b>${f[5][1]}</b></div><div class="k"><span class="mu">Deals</span><b>${f[6][1]}</b></div><div class="k"><span class="mu">Revenue</span><b>${inr(rev)}</b></div><div class="k"><span class="mu">Advance</span><b>${inr(adv)}</b></div></div>
<div class="card" style="margin-top:10px"><span class="mu">Outstanding to collect</span> <b>${inr(out)}</b></div>
<h2>Follow-ups due</h2>${due.slice(0,4).map(l=>card(l,`<div class="mu">${l.next<TD()?'⚠ Overdue ':'Today '}· ${l.next}</div>`)).join('')||'<div class="card mu">Nothing due. Keep dialing.</div>'}
<h2>Hot leads</h2>${hot.map(l=>card(l)).join('')||'<div class="card mu">No leads yet. Tap + to log your first call.</div>'}
<h2>Sales funnel</h2><div class="card">${f.map((x,i)=>`<div class="fb"><span>${x[0]}</span><div><i style="width:${x[1]/mx*100}%"></i></div><em>${x[1]}${i?' · '+(f[i-1][1]?Math.round(x[1]/f[i-1][1]*100):0)+'%':''}</em></div>`).join('')}</div>`}
function leads(){return `<h1>Leads (${S.leads.length})</h1><input id="qs" placeholder="Search name, phone, city, notes" value="${esc(q)}" oninput="q=this.value;ll()"><div class="row" style="margin:8px 0"><select id="fs" onchange="fs=this.value;ll()"><option value="">All stages</option>${STAGES.map(s=>`<option ${fs===s?'selected':''}>${s}</option>`).join('')}</select><select onchange="so=this.value;ll()">${[['score','Highest score'],['new','Newest'],['next','Follow-up date'],['val','Deal value']].map(o=>`<option value="${o[0]}" ${so===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div id="ll"></div>`}
function ll(){let a=S.leads.filter(l=>(!fs||l.stage===fs)&&(!q||[l.name,l.phone,l.contact,l.city,l.cat,l.notes,l.stage].join(' ').toLowerCase().includes(q.toLowerCase())));
a.sort(so==='new'?(x,y)=>y.cr-x.cr:so==='next'?(x,y)=>(x.next||'z')<(y.next||'z')?-1:1:so==='val'?(x,y)=>(y.price||0)-(x.price||0):(x,y)=>score(y)-score(x));
$('#ll').innerHTML=a.slice(0,60).map(l=>card(l)).join('')||'<div class="card mu">No leads match.</div>'}
function fu(){const a=fuList(),t=TD(),g=[['⚠ Overdue',l=>l.next<t],['Today',l=>l.next===t],['Tomorrow',l=>l.next===addD(1)],['This week',l=>l.next>addD(1)&&l.next<=addD(7)],['Later',l=>l.next>addD(7)]];
return `<h1>Follow-ups</h1>`+g.map(([n,f])=>{const r=a.filter(f);return r.length?`<h2>${n} (${r.length})</h2>`+r.map(l=>card(l,`<div class="mu">${l.next} · last: ${l.stage} ${l.price?'· '+inr(l.price):''}</div><div class="row" style="margin-top:6px"><button class="sm" onclick="fdone('${l.id}')">✓ Complete</button><button class="sm" onclick="fre('${l.id}')">Reschedule</button></div>`)).join(''):''}).join('')||'<div class="card mu">No follow-ups scheduled.</div>'}
function fdone(id){const l=lead(id);l.next='';save();draw()}function fre(id){const d=prompt('New date (YYYY-MM-DD)',addD(1));if(d&&/^\d{4}-\d\d-\d\d$/.test(d)){lead(id).next=d;save();draw()}}
function more(){const cs=S.calls,f=fun(cs),w=won(),rev=w.reduce((a,l)=>a+l.price,0),col=S.leads.reduce((a,l)=>a+coll(l),0),m=TD().slice(0,7),mr=w.filter(l=>day(l.wonAt).startsWith(m)).reduce((a,l)=>a+l.price,0),mc=S.leads.flatMap(l=>l.pay||[]).filter(p=>day(p.ts).startsWith(m)).reduce((a,p)=>a+p.amt,0);
const pr=(a,b)=>b?(a/b*100).toFixed(1)+'%':'–';const cats={};cs.forEach(c=>{const l=lead(c.lid),k=l?.cat||'Other';(cats[k]=cats[k]||{c:0,v:0,i:0,d:0,r:0}).c++;if(CONV(c.r))cats[k].v++;if(INT(c.r))cats[k].i++;});w.forEach(l=>{const k=l.cat||'Other';(cats[k]=cats[k]||{c:0,v:0,i:0,d:0,r:0}).d++;cats[k].r+=l.price});
const nr=Object.entries(cats).sort((a,b)=>b[1].r-a[1].r||b[1].c-a[1].c);
const best=Math.max(0,...Object.values(S.calls.reduce((o,c)=>(o[day(c.ts)]=(o[day(c.ts)]||0)+1,o),{})));
const td=fun(callsOn(TD()));let wk='',st='';for(let i=1;i<td.length;i++){const r=td[i-1][1]?td[i][1]/td[i-1][1]:0;if(td[i-1][1]>=3&&(wk===''||r<wk[1]))wk=[td[i][0],r,td[i-1][0]];if(td[i][1]&&(st===''||r>st[1]))st=[td[i][0],r]}
return `<h1>Revenue</h1><div class="card"><div class="row sp"><span>This month closed</span><b>${inr(mr)}</b></div><div class="row sp"><span>This month collected</span><b>${inr(mc)}</b></div><div class="row sp"><span>All-time deal value</span><b>${inr(rev)}</b></div><div class="row sp"><span>Collected</span><b>${inr(col)}</b></div><div class="row sp"><span>Outstanding</span><b>${inr(rev-col)}</b></div><div class="row sp"><span>Deals · avg value</span><b>${w.length} · ${inr(w.length?rev/w.length:0)}</b></div></div>
<h2>Deals</h2>${w.map(l=>`<div class="card" onclick="detail('${l.id}')"><b>${esc(l.name)}</b> <span class="badge">${l.pkg||'Custom'}</span><div class="mu">${inr(l.price)} · collected ${inr(coll(l))} · balance ${inr(l.price-coll(l))} ${l.price-coll(l)<=0?'· PAID IN FULL':''}</div></div>`).join('')||'<div class="card mu">No deals yet.</div>'}
<h2>Performance (all time)</h2><div class="card"><div class="row sp"><span>Answer rate</span><b>${pr(f[1][1],f[0][1])}</b></div><div class="row sp"><span>Interest rate</span><b>${pr(f[3][1],f[2][1])}</b></div><div class="row sp"><span>Proposal conversion</span><b>${pr(w.length,f[5][1])}</b></div><div class="row sp"><span>Call-to-deal</span><b>${pr(w.length,f[0][1])}</b></div><div class="row sp"><span>Best calls in a day</span><b>${best}</b></div><div class="row sp"><span>Streak</span><b>🔥 ${streak()} days</b></div></div>
<h2>Niches (real data)</h2><div class="card wrap"><table><tr><th>Niche</th><th>Calls</th><th>Conv</th><th>Int</th><th>Deals</th><th>₹</th></tr>${nr.map(([k,v])=>`<tr><td>${k}</td><td>${v.c}</td><td>${v.v}</td><td>${v.i}</td><td>${v.d}</td><td>${v.r}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">No data yet</td></tr>'}</table></div>
<h2>Daily review</h2><div class="card"><div>Calls ${td[0][1]} · Answered ${td[1][1]} · Conv ${td[2][1]} · Interested ${td[3][1]} · Deals ${td[6][1]}</div><div class="mu" style="margin-top:6px">${st?'Went well: '+st[0]+' ('+Math.round(st[1]*100)+'% from the stage before).':'Log calls to see insights.'} ${wk?'Needs work: '+wk[2]+' → '+wk[0]+' ('+Math.round(wk[1]*100)+'%).':''} Tomorrow: ${fuList().filter(l=>l.next<=addD(1)).length} follow-ups first, then dial.</div></div>
<h2>Settings</h2><div class="card"><label for="tg">Daily call target</label><input id="tg" type="number" min="1" value="${S.set.target}" onchange="S.set.target=+this.value||200;save();toast('Saved')"><label for="pp">Calls per slot (4 slots: 9–10:30, 11–12:30, 2:30–4, 5–6:30)</label><input id="pp" type="number" min="1" value="${S.set.per}" onchange="S.set.per=+this.value||50;save();toast('Saved')"></div>
<h2>Data</h2><div class="card"><div class="row" style="flex-wrap:wrap"><button class="sm" onclick="exp('leads')">Export leads</button><button class="sm" onclick="exp('calls')">Today’s calls</button><button class="sm" onclick="exp('deals')">Deals</button><button class="sm" onclick="exp('fu')">Follow-ups</button><button class="sm" onclick="imp()">Import CSV</button></div><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="sm" onclick="demo()">Load demo data</button><button class="sm" onclick="clr()">Clear demo data</button></div><p class="mu">Data lives in this browser only. Integrations: Firebase sync, WhatsApp API, notifications: Not connected.</p></div>`}
function sheet(h){$('#shc').innerHTML=h;$('#sh').classList.add('o')}function cl(){$('#sh').classList.remove('o')}
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh')cl()});document.addEventListener('keydown',e=>{if(e.key==='Escape')cl()});
const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');

sheet(`<h1>${esc(l.name)}</h1><div class="mu">${esc(l.phone)} · ${esc(l.cat||"")} · ${esc(l.city||"")}</div><div class="row" style="margin:10px 0">${acts(l)}</div><div class="card">Score ${s} ${tier(s)[0]} · ${l.stage}${l.price?"<br>"+inr(l.price)+" · received "+inr(coll(l))+" · remaining "+inr(bal(l))+(bal(l)<=0?" · PAID IN FULL":""):""}<br><span class="mu">${esc(l.notes||"")}</span></div><label for="d_s">Stage</label><select id="d_s" onchange="stg('${id}',this.value)">${opt(STAGES,l.stage)}</select><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="sm" onclick="pay('${id}')">+ Payment</button><button class="sm" onclick="dealEdit('${id}')">${l.stage==="Won"?"Edit deal":"Make deal"}</button><button class="sm" onclick="ovr('${id}')">Set score</button><button class="sm" onclick="del('${id}')">Delete</button></div><h2>Timeline</h2>${h.map(x=>`<div class="mu">${new Date(x.ts).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} — ${x.t}</div>`).join("")||'<div class="mu">No activity.</div>'}<button style="width:100%;margin-top:12px" onclick="cl()">Close</button>`)}
